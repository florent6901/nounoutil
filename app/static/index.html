<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5b6cff"><title>Nounoutil (Suivi Assmat)</title><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Nounoutil"><meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;--bg:#f3f5fb;--card:#fff;--tx:#1b2140;--mu:#7c84a3;--pr:#5b6cff;--pr2:#8a5bff;--ok:#22c58b;--ab:#ffb020;--sk:#ff5d6c;--nn:#a78bfa;--ln:#e8ebf5}
[data-theme=dark]{color-scheme:dark;--bg:#0f1220;--card:#181c30;--tx:#eef0ff;--mu:#8e96b8;--ln:#262b47}[data-theme=blue]{color-scheme:dark;--bg:#1f3e60;--card:#2a4d75;--tx:#eaf2ff;--mu:#9fb8d6;--pr:#4a9dff;--pr2:#2f6fd6;--ln:#3a5d86}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:90px}
#app{max-width:560px;margin:auto}header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 22px;border-radius:0 0 26px 26px}
h1{margin:0 0 10px;font-size:20px}.pills{display:flex;gap:8px;overflow-x:auto}.pill{border:0;padding:8px 14px;border-radius:99px;background:#fff3;color:#fff;white-space:nowrap;font:inherit;font-weight:600}.pill.on{background:#fff;color:var(--pr)}
.w{padding:0 12px;margin-top:-10px}.c{background:var(--card);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 2px 14px #1b214014}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px}.mn{font-size:17px;font-weight:700}.ib{border:0;background:var(--bg);width:38px;height:38px;border-radius:12px;font-size:16px;color:var(--tx)}
.g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}.h{text-align:center;font-size:11px;color:var(--mu);font-weight:600}
.d{min-width:0;overflow:hidden;aspect-ratio:1/1.1;border-radius:12px;background:var(--bg);padding:4px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;cursor:pointer;border:2px solid transparent;position:relative}.d b{font-size:13px}.d.we{opacity:.7}
.P{background:#22c58b30}.A{background:#ffb02035}.S{background:#ff5d6c30}.nab{background:repeating-linear-gradient(45deg,#a78bfa30,#a78bfa30 6px,#a78bfa18 6px,#a78bfa18 12px)}.d.s{border-color:var(--pr);box-shadow:0 0 0 2px #5b6cff40}.ic{text-align:right;font-size:12px;line-height:1}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:600;background:var(--bg);color:var(--tx);cursor:pointer}.btn.p{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}.btn.on{outline:2px solid var(--pr);background:#5b6cff22}.btn:disabled{opacity:.35}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}.hero .big{font-size:34px;font-weight:800;margin:2px 0}.hero small{opacity:.8}
.l{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}.l:last-child{border:0}.l span:first-child{color:var(--mu)}.l span:last-child{font-weight:700}h3{margin:0 0 4px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #1b214018;z-index:5}nav button{border:0;background:none;font:inherit;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;flex:1}nav button span{font-size:20px}nav .on{color:var(--pr);font-weight:700}
#bd{position:fixed;inset:0;background:#0007;display:none;z-index:9}#sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.bs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:536px;margin:auto;background:var(--tx);color:var(--bg);border-radius:18px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:6}.bar .btn{padding:8px 12px}
#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none;max-width:90%}.nv{background:repeating-linear-gradient(45deg,#38bdf845,#38bdf845 6px,#38bdf822 6px,#38bdf822 12px)}.nm{background:repeating-linear-gradient(45deg,#e879f950,#e879f950 6px,#e879f926 6px,#e879f926 12px)}.nl{font-size:9px;font-weight:700;text-align:center;line-height:1}
.pill small{display:block;font-weight:400;font-size:10px;opacity:.85}.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg);margin-top:8px;cursor:pointer}.sub{font-size:12px;color:var(--mu)}
h4{margin:18px 0 0;font-size:12px;color:var(--pr);text-transform:uppercase;letter-spacing:.05em}.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:99px;padding:9px 14px;font:inherit;cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.mg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.mg .chip{padding:10px 0;text-align:center;border-radius:12px}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}input,select,textarea{font-size:16px;min-width:0}.f>div,.f2>div,.ch>div,.r>*{min-width:0}#sh{overflow-x:hidden}
@media(max-width:430px){.w{padding:0 8px}.c{padding:12px 10px}.g{gap:3px}.d{padding:3px;border-radius:9px}.d b{font-size:12px}.ic{font-size:10px;word-break:break-all}.hm{display:none}.mn{font-size:16px}header{padding-left:12px;padding-right:12px}}.ho{box-shadow:inset 0 0 0 2px #f59e0b}</style></head><body>
<div id="app"></div><div id="bd" onclick="if(event.target==this)closeS()"><div id="sh"></div></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(u,b,m)=>fetch('/api/'+u,b||m?{method:m||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:undefined).then(r=>r.json());
const MN=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],ST={P:['✓','Présent'],A:['✕','Absent'],S:['🤒','Malade']},NS={V:['🌴','Vacances','Vac.'],M:['🩺','Maladie','Mal.']},av=c=>c.sex=='M'?'👦':c.sex=='F'?'👧':'👶',nname=c=>(S.nannies.find(n=>n.id==c.nanny_id)||{}).name||'—';
let S,cid,M,tab='cal',multi=false,sel=new Set(),ds={},ed=[],EC={},ym=new Date().toISOString().slice(0,7);
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const cur=()=>S.children.find(c=>c.id==cid);
function shift(n){let[y,m]=ym.split('-').map(Number);m+=n;if(m>12){m=1;y++}if(m<1){m=12;y--}ym=y+'-'+String(m).padStart(2,'0');sel.clear();load()}
async function load(){S=await api('state');if(!S.children.length)tab='set';else{cid=cur()?cid:S.children[0].id;M=await api(`month?child=${cid}&ym=${ym}`)}render()}
function render(){const[y,m]=ym.split('-').map(Number);let v='';
if(tab=='set')v=settings();else if(tab=='exp')v=exportView();else{const mn=`<div class="c r"><button class=ib onclick=shift(-1)>◀</button><span class=mn>${MN[m-1]} ${y}</span><button class=ib onclick=shift(1)>▶</button></div>`;v=mn+(tab=='cal'?cal(y,m):recap())}
$('#app').innerHTML=`<header><h1><img src="icon.svg" alt="" style="height:28px;width:28px;vertical-align:-7px;margin-right:6px">Nounoutil <small style="font-size:12px;font-weight:500;opacity:.8">(Suivi Assmat)</small></h1>${tab!='set'&&tab!='exp'?`<div class=pills>${S.children.map(c=>`<button class="pill ${c.id==cid?'on':''}" onclick="cid=${c.id};sel.clear();load()">${av(c)} ${esc(c.name)}<small>👩 ${esc(nname(c))}</small></button>`).join('')}</div>`:`<div style="opacity:.85">${tab=='exp'?'Exporter vos récapitulatifs':'Nounous, enfants et tarifs'}</div>`}</header><div class=w>${v}</div>
${multi&&tab=='cal'?`<div class=bar><span><b>${sel.size}</b> jour(s)</span><span><button class=btn onclick="weekdays()">Lun-Ven</button> <button class="btn p" ${sel.size?'':'disabled'} onclick="openS([...sel].sort())">Modifier</button></span></div>`:''}
<nav>${[['cal','📅','Calendrier'],['rec','📊','Récap'],['set','⚙️','Réglages'],['exp','⬇️','Export']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="${k=='exp'?'goExp()':`tab='${k}';render()`}"><span>${i}</span>${l}</button>`).join('')}</nav>`}
function cal(y,m){const n=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7;let g=['L','M','M','J','V','S','D'].map(d=>`<div class=h>${d}</div>`).join('')+'<div></div>'.repeat(off);
for(let i=1;i<=n;i++){const d=`${ym}-${String(i).padStart(2,'0')}`,r=M.days[d]||{},nn=M.ndays[d],we=(off+i-1)%7>4;
g+=`<div class="d ${r.status||''} ${nn?(nn=='V'?'nv':'nm'):''} ${we?'we':''} ${sel.has(d)?'s':''} ${M.hol[d]?'ho':''}" onclick="tap('${d}')"><b>${i}${M.hol[d]?'🎉':''}</b><div class=ic>${nn?`<span style="font-size:16px">${NS[nn][0]}</span>`:r.status?ST[r.status][0]:''}${r.km?'🚗':''}${r.comment?'📝':''}</div>${nn?`<div class=nl>${NS[nn][2]}</div>`:''}</div>`}
return `<div class=c><div class=r><div><b>Calendrier</b><div class=sub>👩 ${esc(nns())}</div></div><button class="btn ${multi?'on':''}" onclick="multi=!multi;sel.clear();render()">☑️<span class=hm> Sélection multiple</span></button></div><div class=g>${g}</div>
<div class=lg><span><i style=background:#22c58b></i>Présent</span><span><i style=background:#ffb020></i>Absent</span><span><i style=background:#ff5d6c></i>Malade</span><span><i style=background:#38bdf8></i>Nounou en vacances</span><span><i style=background:#e879f9></i>Nounou malade</span><span><i style="background:none;border:2px solid #f59e0b"></i>Jour férié</span><span>🚗 km · 📝 note</span></div></div>`}
function tap(d){if(multi){sel.has(d)?sel.delete(d):sel.add(d);render()}else openS([d])}
function weekdays(){const[y,m]=ym.split('-').map(Number);for(let i=1;i<=new Date(y,m,0).getDate();i++){const w=new Date(y,m-1,i).getDay();if(w&&w<6)sel.add(`${ym}-${String(i).padStart(2,'0')}`)}render()}
function recap(){const L=M.lines,t=L[L.length-1][1],grp=(h,a)=>`<div class=c><h3>${h}</h3>${a.map(i=>`<div class=l><span>${L[i][0]}</span><span>${L[i][1]}</span></div>`).join('')}</div>`;
return `<div class="c hero"><small>Total à verser — ${esc(cur().name)} · 👩 ${esc(nns())}</small><div class=big>${t.toFixed(2)} €</div><small>dont salaire net ${L[10][1]} €</small></div>
${rates()}${grp('Présences',[0,1,2,3,4])}${grp('Pajemploi — heures & salaire',[5,6,7,8,9,10,11])}${grp('Indemnités',[12,13,14,15])}
<div class=r><button class="btn p" style=flex:1 onclick="location='/api/export/pdf?child=${cid}&ym=${ym}'">📄 PDF</button><button class="btn p" style=flex:1 onclick="location='/api/export/xlsx?child=${cid}&ym=${ym}'">📗 Excel</button></div>`}
function openS(dates){ed=dates;const one=dates.length==1,r=one?(M.days[dates[0]]||{}):{};const blocked=dates.some(d=>M.ndays[d]);
ds=one?{st:r.status||'',ns:M.ndays[dates[0]]||'',hol:!!M.hol[dates[0]]}:{};
const title=one?new Date(dates[0]+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}):`${dates.length} jours sélectionnés`;
$('#bd').style.display='block';$('#sh').innerHTML=`<div class=r><h2 style="margin:0;font-size:18px;text-transform:capitalize">${title}</h2><button class=ib onclick=closeS()>✕</button></div>
<label>Enfant — ${esc(cur().name)}</label><div class=bs id=cs></div>
<div class=f><div><label>Heures (vide = prévu)</label><input id=hh type=number step=.25 value="${r.hours??''}"></div><div><label>Repas</label><input id=mm type=number value="${one?(r.meals??1):''}"></div><div><label>Km nounou</label><input id=km type=number step=.1 value="${r.km??''}"></div></div>
<label>Commentaire</label><textarea id=cm rows=2></textarea>
<label>Nounou</label><div class=bs id=ns></div><p id=wn style="font-size:12px;color:var(--mu);margin:0 0 10px"></p><label>Jour</label><div class=bs id=hs style="grid-template-columns:1fr;margin-bottom:6px"></div><p id=hn style="font-size:12px;color:var(--mu);margin:0 0 10px"></p><button class="btn p" style=width:100% onclick=saveS()>Enregistrer</button>`;
$('#cm').value=r.comment||'';chips()}
function chips(){const nab=ds.ns;$('#hs').innerHTML=`<button class="btn ${ds.hol?'on':''}" onclick="ds.hol=ds.hol?(ed.length>1?undefined:false):true;chips()">🎉 Jour férié${ds.hol?' ✓':''}</button>`;$('#hn').textContent=ds.hol?'Jour férié : choisir « Présent » (travaillé, majoration éventuelle) ou « Absent ».':'';$('#cs').innerHTML=Object.entries(ST).map(([k,[i,l]])=>`<button class="btn ${ds.st==k?'on':''}" ${nab?'disabled':''} onclick="ds.st=ds.st=='${k}'?(ed.length>1?undefined:''):'${k}';chips()">${i}<br>${l}</button>`).join('');
$('#ns').innerHTML=Object.entries(NS).map(([k,[i,l]])=>`<button class="btn ${nab==k?'on':''}" onclick="ds.ns=ds.ns=='${k}'?(ed.length>1?undefined:''):'${k}';if(ds.ns)ds.st=ed.length>1?undefined:'';chips()">${i}<br>${l}</button>`).join('')+`<button class=btn onclick="ds.ns='';chips()">Nounou<br>présente</button>`;
$('#wn').textContent=nab?'Nounou absente : aucun état possible pour l\'enfant ce jour-là.':''}
function closeS(){$('#bd').style.display='none'}
async function saveS(){const one=ed.length==1,v=id=>$('#'+id).value,j={child_id:cid,dates:ed};let sk=0,rm=0;
if(ds.hol!==undefined)await api('holiday',{dates:ed,on:ds.hol});if(ds.ns!==undefined)rm=(await api('nday',{child_id:cid,dates:ed,status:ds.ns})).removed;
if(one){j.status=ds.st||'';j.hours=v('hh')?+v('hh'):null;j.meals=v('mm')!==''?+v('mm'):null;j.km=v('km')?+v('km'):null;j.comment=v('cm')}
else{if(ds.st!==undefined)j.status=ds.st;if(v('hh'))j.hours=+v('hh');if(v('mm')!=='')j.meals=+v('mm');if(v('km'))j.km=+v('km');if(v('cm'))j.comment=v('cm')}
sk=(await api('day',j)).skipped;closeS();sel.clear();multi=false;if(sk)toast(`${sk} jour(s) ignoré(s) : nounou absente`);else if(rm)toast(`${rm} jour(s) de l\'enfant vidé(s) (nounou absente)`);load()}
const D={hol:0,sun:0,maj:25,net2brut:0.7812,meal:0,weeks:52,kmrate:0,hw:40,dw:4};
const fld=(k,l,u)=>`<div><label>${l}</label><div style=position:relative><input id=f_${k} type=number step=any inputmode=decimal value="${esc(EC[k]??D[k]??'')}"><span style="position:absolute;right:10px;top:12px;color:var(--mu);font-size:12px">${u||''}</span></div></div>`;
function settings(){return (S.nannies.map(n=>`<div class=c><div class=r><b style="font-size:17px">👩 ${esc(n.name)}</b><span><button class=ib onclick="renN(${n.id})">✏️</button> <button class=ib onclick="del('nanny',${n.id})">🗑</button></span></div>
${S.children.filter(c=>c.nanny_id==n.id).map(c=>`<div class=ch onclick="openC(${n.id},${c.id})"><span style="font-size:22px">${av(c)}</span><div style=flex:1><b>${esc(c.name)}</b><div class=sub>${c.hw} h/sem · ${(+c.rate).toFixed(2)} €/h · ${(+c.indem).toFixed(2)} €/j · ${c.mode=='reel'?'heures réelles':'mensualisé'}</div></div><span style=color:var(--mu)>›</span></div>`).join('')}
<button class=btn style="width:100%;margin-top:10px" onclick="openC(${n.id})">＋ Ajouter un enfant</button></div>`).join('')||'<div class=c><p style=color:var(--mu)>Commencer par ajouter une nounou, puis ses enfants.</p></div>')+`<div class="c r"><input id=nn placeholder="Nom d'une nouvelle nounou"><button class="btn p" onclick=addN()>＋</button></div>`+installCard()+themeCard()}
const T0='2000-01-01',today=()=>new Date().toISOString().slice(0,10),fd2=s=>s.split('-').reverse().join('/'),fd=s=>s.slice(8)+'/'+s.slice(5,7),eu=v=>(+v||0).toFixed(2).replace('.',',')+' €',nns=()=>[...new Set(M.segs.map(s=>s.nanny))].join(' → ');let CS={};
function rates(){return M.segs.map(s=>`<div class=c><h3>Tarifs appliqués${M.segs.length>1?` · du ${fd(s.frm)} au ${fd(s.to)}`:''}</h3><div class=l><span>Nounou</span><span>${esc(s.nanny)}</span></div><div class=l><span>Taux horaire net</span><span>${eu(s.rate)} /h</span></div><div class=l><span>Indemnité d'entretien</span><span>${eu(s.indem)} /jour</span></div>${s.meal?`<div class=l><span>Repas</span><span>${eu(s.meal)}</span></div>`:''}${s.kmrate?`<div class=l><span>Indemnité km</span><span>${eu(s.kmrate)} /km</span></div>`:''}${s.sun?`<div class=l><span>Majoration dimanche</span><span>+${s.sun} %</span></div>`:''}<div class=l><span>Jours fériés</span><span>${s.hol_paid===0?'non payés':'payés'}${s.hol?` · +${s.hol} %`:''}</span></div><div class=l><span>Contrat</span><span>${s.hw} h/sem · ${s.mode=='reel'?'réel':'mensualisé'}</span></div></div>`).join('')}
const TH={light:'☀️ Clair',blue:'🌊 Bleu',dark:'🌙 Sombre'},th=()=>document.documentElement.dataset.theme;
function themeCard(){return `<div class=c><h3>Thème</h3><div class=chips>${Object.entries(TH).map(([k,l])=>`<button class="chip ${th()==k?'on':''}" onclick="setTh('${k}')">${l}</button>`).join('')}</div></div>`}
function setTh(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}render()}
function openC(nid,id){const cs=id?S.contracts.filter(k=>k.child_id==id).sort((a,b)=>a.start<b.start?-1:1):[],ch=id&&S.children.find(c=>c.id==id),cu=cs.filter(k=>k.start<=today()).pop()||cs[0];CS={id,nid,cs,name:ch?ch.name:'',sex:ch&&ch.sex||'',sel:cu?cu.id:0};showC()}
function pick(s){CS.name=$('#f_name').value;CS.sex=$('#f_sex').value;CS.sel=s;showC()}
function showC(){const nw=CS.id&&!CS.sel,cu=CS.cs.find(k=>k.id==CS.sel),last=CS.cs[CS.cs.length-1];EC=cu?{...cu}:last?{...last,start:''}:{nanny_id:CS.nid};const dF=nw||(cu&&cu.start!=T0);
$('#bd').style.display='block';$('#sh').innerHTML=`<div class=r><h2 style="margin:0;font-size:18px">${CS.id?'Modifier':'Nouvel'} enfant</h2><button class=ib onclick=closeS()>✕</button></div>
<div class=f2><div><label>Prénom</label><input id=f_name value="${esc(CS.name)}"></div><div><label>Sexe</label><select id=f_sex><option value="">👶 Non précisé</option><option value=F ${CS.sex=='F'?'selected':''}>👧 Fille</option><option value=M ${CS.sex=='M'?'selected':''}>👦 Garçon</option></select></div></div>
${CS.id?`<h4>Historique des contrats</h4><div class=chips style="margin-top:8px">${CS.cs.map(k=>`<button class="chip ${CS.sel==k.id?'on':''}" onclick="pick(${k.id})">${k.start==T0?'Depuis le début':'Dès le '+fd2(k.start)}</button>`).join('')}<button class="chip ${nw?'on':''}" onclick="pick(0)">＋ Nouveau</button></div>`:''}
${dF?`<label>Date d'effet (1er jour de ce contrat / tarif)</label><input id=f_start type=date value="${EC.start||today()}">${nw?'<p class=sub style="margin:6px 0 0">Les jours avant cette date gardent leurs anciens tarifs et leur ancienne nounou.</p>':''}`:''}
<label>Nounou</label><select id=f_nanny_id>${S.nannies.map(n=>`<option value=${n.id} ${n.id==EC.nanny_id?'selected':''}>${esc(n.name)}</option>`).join('')}</select>
<h4>Contrat</h4><div class=f2>${fld('hw','Heures / semaine','h')}${fld('dw','Jours / semaine','j')}${fld('weeks','Semaines / an (52 = complet)','sem')}<div><label>Mode de calcul</label><select id=f_mode><option value=mensualise>Mensualisé</option><option value=reel ${EC.mode=='reel'?'selected':''}>Heures réelles</option></select></div></div>
<h4>Rémunération</h4><div class=f2>${fld('rate','Taux horaire net','€/h')}${fld('maj','Majoration > 45 h','%')}${fld('sun','Majoration dimanche','%')}${fld('net2brut','Coef. net → brut','')}<div><label>Déduire enfant malade</label><select id=f_dsick><option value=0>Non</option><option value=1 ${EC.dsick?'selected':''}>Oui (certificat)</option></select></div><div><label>Déduire nounou malade</label><select id=f_dnm><option value=1 ${EC.dnm===0?'':'selected'}>Oui</option><option value=0 ${EC.dnm===0?'selected':''}>Non</option></select></div>${fld('hol','Majoration jour férié travaillé','%')}<div><label>Jours fériés payés</label><select id=f_holp><option value=1 ${EC.hol_paid===0?'':'selected'}>Oui</option><option value=0 ${EC.hol_paid===0?'selected':''}>Non</option></select></div></div>
<h4>Indemnités</h4><div class=f2>${fld('indem','Entretien / jour','€')}${fld('meal','Repas','€')}${fld('kmrate','Km nounou','€/km')}</div>
<button class="btn p" style="width:100%;margin-top:18px" onclick=saveC()>Enregistrer</button>${CS.id&&CS.sel&&CS.cs.length>1?`<button class=btn style="width:100%;margin-top:8px" onclick="delC(${CS.sel})">Supprimer ce contrat</button>`:''}${CS.id?`<button class=btn style="width:100%;margin-top:8px;color:var(--sk)" onclick="del('child',${CS.id})">Supprimer cet enfant</button>`:''}`}
async function renN(i){const n=prompt('Nom de la nounou',S.nannies.find(x=>x.id==i).name);if(n){await api('nanny',{id:i,name:n});load()}}
async function addN(){if($('#nn').value.trim()){await api('nanny',{name:$('#nn').value.trim()});load()}}
async function del(t,i){if(confirm(t=='nanny'?'Supprimer cette nounou ?':'Supprimer cet enfant, ses contrats et tout son historique ?')){const r=await api(t+'/'+i,0,'DELETE');if(r.error)return toast(r.error);closeS();load()}}
async function delC(i){if(confirm('Supprimer ce contrat ?')){await api('contract/'+i,0,'DELETE');closeS();load()}}
async function saveC(){const b={id:CS.id||null,name:$('#f_name').value.trim(),sex:$('#f_sex').value,nanny_id:+$('#f_nanny_id').value,mode:$('#f_mode').value,dsick:+$('#f_dsick').value,dnm:+$('#f_dnm').value,hol_paid:+$('#f_holp').value,cid:CS.sel||null};if(!b.name)return toast('Prénom requis');const cu=CS.cs.find(k=>k.id==CS.sel);b.start=$('#f_start')?$('#f_start').value:(cu?cu.start:T0);if(!b.start)return toast("Date d'effet requise");
['hw','dw','weeks','rate','maj','sun','hol','net2brut','indem','meal','kmrate'].forEach(k=>b[k]=+$('#f_'+k).value||0);b.dw=b.dw||1;await api('child',b);closeS();toast('Enregistré ✓');load()}
let X={ch:new Set(),mo:new Set(),fm:new Set(['pdf']),y:+ym.slice(0,4),act:{}};
async function goExp(){tab='exp';X.act=await api('active');if(!X.ch.size&&cid)X.ch.add(+cid);render()}
const tg=(k,v)=>{X[k].has(v)?X[k].delete(v):X[k].add(v);render()},mk=i=>`${X.y}-${String(i).padStart(2,'0')}`,has=m=>[...X.ch].some(i=>(X.act[i]||[]).includes(m));
const allY=()=>{for(let i=1;i<=12;i++)X.mo.add(mk(i));render()},dataY=()=>{for(let i=1;i<=12;i++)has(mk(i))&&X.mo.add(mk(i));render()};
function exportView(){const L=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'],n=X.ch.size*X.mo.size*X.fm.size,on=(s,v)=>s.has(v)?'on':'';
return `<div class=c><h3>1 · Enfants</h3><div class=chips>${S.children.map(c=>`<button class="chip ${on(X.ch,c.id)}" onclick="tg('ch',${c.id})">${av(c)} ${esc(c.name)}</button>`).join('')||'<span class=sub>Aucun enfant</span>'}</div></div>
<div class=c><h3>2 · Mois</h3><div class=r><button class=ib onclick="X.y--;render()">◀</button><span class=mn>${X.y}</span><button class=ib onclick="X.y++;render()">▶</button></div>
<div class=mg>${L.map((l,i)=>`<button class="chip ${on(X.mo,mk(i+1))}" onclick="tg('mo','${mk(i+1)}')">${l}${has(mk(i+1))?' •':''}</button>`).join('')}</div>
<div class=chips style="margin-top:12px"><button class=chip onclick=allY()>Toute l'année</button><button class=chip onclick=dataY()>Mois avec données</button><button class=chip onclick="X.mo.clear();render()">Effacer</button></div>
<p class=sub style="margin:10px 0 0">• = données saisies · ${X.mo.size} mois sélectionné(s), toutes années confondues</p></div>
<div class=c><h3>3 · Format</h3><div class=chips><button class="chip ${on(X.fm,'pdf')}" onclick="tg('fm','pdf')">📄 PDF</button><button class="chip ${on(X.fm,'xlsx')}" onclick="tg('fm','xlsx')">📗 Excel</button></div></div>
<button class="btn p" style="width:100%" ${n?'':'disabled'} onclick=doExp()>⬇️ Exporter ${n?`(${n} fichier${n>1?'s':''}${n>1?', en ZIP':''})`:''}</button>`}
function doExp(){const ch=[...X.ch],mo=[...X.mo].sort(),fm=[...X.fm];location=ch.length*mo.length*fm.length==1?`/api/export/${fm[0]}?child=${ch[0]}&ym=${mo[0]}`:`/api/bulk?children=${ch}&months=${mo}&fmt=${fm}`}
let DP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(tab=='set')render()});addEventListener('appinstalled',()=>{DP=null;toast('Application installée ✓');render()});
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
function installCard(){return `<div class=c><h3>Application</h3><p class=sub style="margin:0 0 10px">Installer Nounoutil sur l'écran d'accueil : plein écran, icône dédiée, accès en un geste.</p><button class="btn p" style=width:100% onclick=installApp()>📲 Installer sur ce ${isIOS?'iPhone / iPad':'téléphone'}</button>${!isIOS&&!isSecureContext&&!DP?`<p class=sub style="margin:10px 0 0">⚠️ Connexion non sécurisée (HTTP) : Chrome ne propose pas l'installation complète. <a href=# onclick="helpInstall();return false" style=color:var(--pr)>Voir comment faire</a></p>`:''}</div>`}
async function installApp(){if(DP){DP.prompt();await DP.userChoice;DP=null;render();return}helpInstall()}
function helpInstall(){let b;
if(isIOS)b=`<ol style="padding-left:20px;line-height:1.7"><li>Ouvrir cette page dans <b>Safari</b></li><li>Toucher le bouton <b>Partager</b> (carré avec une flèche ↑)</li><li>Faire défiler et choisir <b>« Sur l'écran d'accueil »</b></li><li>Toucher <b>Ajouter</b></li></ol>`;
else if(!isSecureContext)b=`<p>Chrome n'installe une vraie application que sur une adresse <b>HTTPS</b>. Ici l'adresse est en HTTP (<code>${esc(location.origin)}</code>).</p><h4>Solution simple</h4><p class=sub>Créer un raccourci : menu <b>⋮</b> de Chrome → <b>Ajouter à l'écran d'accueil</b> → <b>Créer un raccourci</b>.</p><h4>Installation complète</h4><ul style="padding-left:20px;line-height:1.6"><li>Passer en HTTPS (voir le README, section « Installer comme application »)</li><li>Ou, pour ce téléphone seulement : ouvrir <code>chrome://flags/#unsafely-treat-insecure-origin-as-secure</code> dans Chrome, activer l'option, ajouter <code>${esc(location.origin)}</code>, relancer Chrome, puis menu <b>⋮</b> → <b>Installer l'application</b></li></ul>`;
else b=`<ol style="padding-left:20px;line-height:1.7"><li>Ouvrir le menu <b>⋮</b> de Chrome</li><li>Toucher <b>Installer l'application</b> (ou <b>Ajouter à l'écran d'accueil</b>)</li><li>Confirmer avec <b>Installer</b></li></ol>`;
$('#bd').style.display='block';$('#sh').innerHTML=`<div class=r><h2 style="margin:0;font-size:18px">📲 Installer Nounoutil</h2><button class=ib onclick=closeS()>✕</button></div><div style="margin-top:10px">${b}</div><button class="btn p" style="width:100%;margin-top:10px" onclick=closeS()>Compris</button>`}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
try{document.documentElement.dataset.theme=localStorage.getItem('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}
load();
</script></body></html>
